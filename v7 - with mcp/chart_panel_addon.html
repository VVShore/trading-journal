<!-- ═══════════════════════════════════════════════════
     READ CHART PANEL
     Add this block to index.html inside page-log,
     just before the state-grid div.
     Also add the CSS and JS sections as noted.
═══════════════════════════════════════════════════ -->

<!-- ── READ CHART PANEL (place before state-grid in page-log) ── -->
<div id="chart-panel">

  <!-- Status row -->
  <div class="chart-bar" id="chart-bar">
    <div class="chart-status" id="chart-status">
      <span class="cs-dot" id="cs-dot"></span>
      <span id="cs-text">TradingView not checked</span>
    </div>
    <div class="chart-actions">
      <button class="chart-btn" id="read-chart-btn" onclick="readChart()">
        Read Chart
      </button>
      <button class="chart-btn secondary" id="tv-screenshot-btn" onclick="takeScreenshot()">
        📸 Screenshot
      </button>
    </div>
  </div>

  <!-- Chart data panel (hidden until read) -->
  <div class="chart-data" id="chart-data" style="display:none">
    <div class="cd-header">
      <span id="cd-symbol" class="cd-symbol">—</span>
      <span id="cd-tf" class="cd-tf"></span>
      <span id="cd-price" class="cd-price"></span>
      <button class="cd-apply-btn" onclick="applyChartData()" id="apply-btn">Apply to Log →</button>
    </div>

    <div class="cd-grid">
      <!-- Levels -->
      <div class="cd-section">
        <div class="cd-slbl">Session Levels</div>
        <div id="cd-levels" class="cd-items"></div>
      </div>

      <!-- Orderblocks -->
      <div class="cd-section" id="cd-ob-section" style="display:none">
        <div class="cd-slbl">Nearby OBs</div>
        <div id="cd-obs" class="cd-items"></div>
      </div>

      <!-- FVGs -->
      <div class="cd-section" id="cd-fvg-section" style="display:none">
        <div class="cd-slbl">Nearby FVGs</div>
        <div id="cd-fvgs" class="cd-items"></div>
      </div>

      <!-- Suggestions -->
      <div class="cd-section">
        <div class="cd-slbl">Suggested Inputs</div>
        <div id="cd-suggestions" class="cd-items"></div>
      </div>
    </div>

    <!-- Active indicators -->
    <div class="cd-indicators" id="cd-indicators"></div>
  </div>

</div>


<!-- ═══════════════════════════════════════════════════
     CSS — add inside <style> tag in index.html
═══════════════════════════════════════════════════ -->
<style>
/* ── CHART PANEL ── */
.chart-bar{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);
  padding:9px 13px;margin-bottom:8px;gap:10px;flex-wrap:wrap
}
.chart-status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t3)}
.cs-dot{
  width:7px;height:7px;border-radius:50%;background:var(--t3);
  flex-shrink:0;transition:background .3s
}
.cs-dot.ok{background:var(--g)}.cs-dot.err{background:var(--r)}.cs-dot.loading{background:var(--y);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.chart-actions{display:flex;gap:6px}
.chart-btn{
  padding:6px 13px;border-radius:6px;border:1.5px solid var(--b);
  background:var(--bs);color:var(--b);font-size:11px;font-weight:700;
  cursor:pointer;transition:all .15s;font-family:var(--font)
}
.chart-btn:hover{filter:brightness(1.1)}
.chart-btn:disabled{opacity:.4;cursor:not-allowed}
.chart-btn.secondary{border-color:var(--b2);background:var(--s2);color:var(--t2)}
.chart-btn.secondary:hover{border-color:var(--b3);color:var(--t1)}

.chart-data{
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px
}
.cd-header{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap
}
.cd-symbol{font-size:15px;font-weight:800;color:var(--t1)}
.cd-tf{font-size:11px;color:var(--t3);background:var(--s2);padding:2px 7px;border-radius:4px}
.cd-price{font-size:14px;font-weight:700;color:var(--b);margin-left:auto}
.cd-apply-btn{
  padding:6px 14px;border-radius:6px;border:none;background:var(--b);color:#fff;
  font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;font-family:var(--font)
}
.cd-apply-btn:hover{filter:brightness(1.1)}

.cd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cd-section{background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:9px 11px}
.cd-slbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);font-weight:700;margin-bottom:6px}
.cd-items{display:flex;flex-direction:column;gap:3px}
.cd-item{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid var(--b1)}
.cd-item:last-child{border:none}
.cd-ilbl{color:var(--t3)}
.cd-ival{font-weight:700;color:var(--t1)}
.cd-ival.g{color:var(--g)}.cd-ival.r{color:var(--r)}.cd-ival.b{color:var(--b)}.cd-ival.y{color:var(--y)}

.cd-indicators{
  display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid var(--b1);padding-top:8px
}
.cd-ind-chip{
  padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;
  background:var(--gd);color:var(--g);border:1px solid #182e20
}
.cd-ind-chip.inactive{background:var(--s3);color:var(--t3);border-color:var(--b1)}

/* Suggestion chips */
.sug-chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;
  border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--b2);background:var(--s2);color:var(--t2);
  transition:all .15s;margin:2px 0
}
.sug-chip:hover{border-color:var(--b);color:var(--b)}
.sug-chip.applied{border-color:var(--g);background:var(--gd);color:var(--g)}
.sug-chip .sug-key{color:var(--t3);font-size:10px;margin-right:2px}
</style>


<!-- ═══════════════════════════════════════════════════
     JAVASCRIPT — add inside the <script> tag in index.html
     (near the bottom, before the closing </script>)
═══════════════════════════════════════════════════ -->
<script>
// ── CHART BRIDGE ──────────────────────────────────────
let chartData = null;

async function checkChartStatus(){
  try{
    const d = await fetch(`${API}/chart/status`, {signal: AbortSignal.timeout(5000)}).then(r=>r.json());
    const dot = document.getElementById('cs-dot');
    const txt = document.getElementById('cs-text');
    if(d.connected){
      dot.className = 'cs-dot ok';
      txt.textContent = 'TradingView connected';
      txt.style.color = 'var(--g)';
    } else {
      dot.className = 'cs-dot err';
      txt.textContent = d.hint || 'TradingView not connected — launch with debug port';
      txt.style.color = 'var(--r)';
    }
  } catch(e){
    document.getElementById('cs-dot').className = 'cs-dot err';
    document.getElementById('cs-text').textContent = 'Could not check TradingView';
  }
}

async function readChart(){
  const btn = document.getElementById('read-chart-btn');
  const dot = document.getElementById('cs-dot');
  const txt = document.getElementById('cs-text');
  btn.disabled = true;
  btn.textContent = 'Reading...';
  dot.className = 'cs-dot loading';
  txt.textContent = 'Reading chart indicators...';

  try{
    const d = await fetch(`${API}/chart/read`, {signal: AbortSignal.timeout(22000)}).then(r=>r.json());

    if(d.error || !d.connected){
      dot.className = 'cs-dot err';
      txt.textContent = d.error || 'TradingView not connected';
      txt.style.color = 'var(--r)';
      btn.disabled = false; btn.textContent = 'Read Chart';
      return;
    }

    dot.className = 'cs-dot ok';
    txt.textContent = 'Chart read successfully';
    txt.style.color = 'var(--g)';
    chartData = d;
    renderChartData(d);
  }catch(e){
    dot.className = 'cs-dot err';
    txt.textContent = e.name === 'TimeoutError' ? 'Read timed out — is TradingView open with debug port?' : 'Read failed: ' + e.message;
    txt.style.color = 'var(--r)';
  }

  btn.disabled = false; btn.textContent = 'Read Chart';
}

function renderChartData(d){
  const panel = document.getElementById('chart-data');
  panel.style.display = 'block';

  // Header
  document.getElementById('cd-symbol').textContent = d.chart?.symbol || '—';
  document.getElementById('cd-tf').textContent = d.chart?.timeframe || '';
  const price = d.quote?.price;
  document.getElementById('cd-price').textContent = price ? price.toFixed(2) : '';

  // Session levels
  const levelsEl = document.getElementById('cd-levels');
  const levels = d.levels || {};
  const levelItems = [
    {label:'Asia High',    val:levels.asia_high,    color:'g'},
    {label:'Asia Low',     val:levels.asia_low,     color:'r'},
    {label:'London High',  val:levels.london_high,  color:'g'},
    {label:'London Low',   val:levels.london_low,   color:'r'},
    {label:'Prev Day High',val:levels.pdh,           color:'g'},
    {label:'Prev Day Low', val:levels.pdl,           color:'r'},
  ].filter(i => i.val);

  levelsEl.innerHTML = levelItems.length
    ? levelItems.map(i => `
        <div class="cd-item">
          <span class="cd-ilbl">${i.label}</span>
          <span class="cd-ival ${i.color}">${i.val?.toFixed(2)}</span>
        </div>`).join('')
    : '<div style="color:var(--t3);font-size:11px">No session levels detected.<br>Ensure Killzones indicator is active.</div>';

  // OBs
  const obs = d.orderblocks;
  const obSection = document.getElementById('cd-ob-section');
  if(obs && (obs.bullish?.length || obs.bearish?.length)){
    obSection.style.display = 'block';
    const obsEl = document.getElementById('cd-obs');
    const allObs = [
      ...obs.bullish.map(o=>({...o, side:'Bull'})),
      ...obs.bearish.map(o=>({...o, side:'Bear'})),
    ].sort((a,b)=>a.dist_pct - b.dist_pct);
    obsEl.innerHTML = allObs.map(o => `
      <div class="cd-item">
        <span class="cd-ilbl">${o.side} OB</span>
        <span class="cd-ival ${o.side==='Bull'?'g':'r'}">${o.top?.toFixed(2)} – ${o.bottom?.toFixed(2)}</span>
      </div>`).join('');
  } else {
    obSection.style.display = 'none';
  }

  // FVGs
  const fvgSection = document.getElementById('cd-fvg-section');
  if(d.fvgs?.length){
    fvgSection.style.display = 'block';
    document.getElementById('cd-fvgs').innerHTML = d.fvgs.map(f => `
      <div class="cd-item">
        <span class="cd-ilbl">FVG</span>
        <span class="cd-ival b">${f.price?.toFixed(2)} (${f.dist_pct?.toFixed(2)}%)</span>
      </div>`).join('');
  } else {
    fvgSection.style.display = 'none';
  }

  // Suggestions
  const sug = d.suggested || {};
  const sugEl = document.getElementById('cd-suggestions');
  const sugItems = [];
  if(sug.direction)  sugItems.push({key:'Direction', val:sug.direction, field:'dir'});
  if(sug.session)    sugItems.push({key:'Session',   val:sug.session,   field:'session'});
  if(sug.dol_source) sugItems.push({key:'DOL',       val:sug.dol_source.replace(/_/g,' '), field:'dol'});
  if(sug.liq_flow)   sugItems.push({key:'Flow',      val:sug.liq_flow.replace(/_/g,' → ').replace('erl','ERL').replace('irl','IRL'), field:'flow'});

  sugEl.innerHTML = sugItems.map(s => `
    <div class="cd-item">
      <span class="cd-ilbl">${s.key}</span>
      <span class="cd-ival b">${s.val}</span>
    </div>`).join('') || '<div style="color:var(--t3);font-size:11px">No suggestions (need session levels to infer)</div>';

  // Active indicator chips
  const found = d.indicators_found || {};
  const ALL_INDICATORS = {
    killzones: 'Killzones',
    pivots:    'Pivots',
    orderblock:'Order Blocks',
    fvg:       'FVG/iFVG',
    smt:       'SMT',
    volume_profile:'Vol Profile',
  };
  const indEl = document.getElementById('cd-indicators');
  indEl.innerHTML = Object.entries(ALL_INDICATORS).map(([key, label]) => {
    const active = !!found[key];
    return `<span class="cd-ind-chip ${active?'':'inactive'}">${active?'✓ ':''} ${label}</span>`;
  }).join('');
}

function applyChartData(){
  if(!chartData) return;
  const sug = chartData.suggested || {};

  // Direction
  if(sug.direction){
    const btn = document.getElementById(sug.direction === 'long' ? 'ob-long' : 'ob-short');
    if(btn){ selOb('dir', sug.direction, btn); }
  }

  // Session
  if(sug.session){
    const sesG = document.getElementById('sess-opt-grid');
    const btns = sesG?.querySelectorAll('.ob') || [];
    btns.forEach(b => {
      if(b.textContent.toLowerCase().includes(sug.session.replace('_',' '))){
        selObGroup('session', sug.session, b, sesG);
      }
    });
    // Open the optional context if not already open
    const optBody = document.getElementById('opt-body');
    if(optBody && !optBody.classList.contains('open')){
      document.getElementById('opt-hdr')?.classList.add('open');
      optBody.classList.add('open');
    }
  }

  // Notes
  if(sug.notes){
    const noteEl = document.getElementById('note-in');
    if(noteEl && !noteEl.value) noteEl.value = sug.notes;
  }

  // Mark suggestions as applied
  document.getElementById('apply-btn').textContent = '✓ Applied';
  document.getElementById('apply-btn').style.background = 'var(--gd)';
  document.getElementById('apply-btn').style.borderColor = 'var(--g)';
  document.getElementById('apply-btn').style.color = 'var(--g)';

  toast('Chart data applied to log');
}

async function takeScreenshot(){
  const btn = document.getElementById('tv-screenshot-btn');
  btn.disabled = true; btn.textContent = '📸 Taking...';
  try{
    const d = await fetch(`${API}/chart/screenshot`, {method:'POST', signal: AbortSignal.timeout(15000)}).then(r=>r.json());
    if(d.success && d.path){
      // Load the screenshot into the drop zone
      const imgUrl = `${API}/images/${d.filename}`;
      const imgEl = document.getElementById('preview');
      const hintEl = document.getElementById('shot-hint');
      const clearEl = document.getElementById('shot-clear');

      // Fetch as blob for the file state
      const blob = await fetch(imgUrl).then(r=>r.blob());
      S.file = new File([blob], d.filename, {type:'image/png'});

      imgEl.src = imgUrl;
      imgEl.style.display = 'block';
      hintEl.style.display = 'none';
      clearEl.style.display = 'block';

      toast('TradingView screenshot captured');
    } else {
      toast(d.error || 'Screenshot failed', 'err');
    }
  }catch(e){
    toast(e.name === 'TimeoutError' ? 'Screenshot timed out' : 'Screenshot failed', 'err');
  }
  btn.disabled = false; btn.textContent = '📸 Screenshot';
}

// Check status on load (quietly)
setTimeout(checkChartStatus, 1500);
</script>
